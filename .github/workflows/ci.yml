name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/xiantongw/srd-dev:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment info
        run: |
          echo "Running on:"
          uname -a
          echo
          echo "CMake version:"
          cmake --version
          echo
          echo "Ninja version:"
          ninja --version

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Set build status (success)
        if: ${{ success() }}
        run: echo "Build succeeded"

      - name: Set build status (failure)
        if: ${{ failure() }}
        run: echo "Build failed"
